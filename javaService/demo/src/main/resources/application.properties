spring.application.name=demo
server.port=8080
# 减少控制台非日志输出（业务日志见 logback-spring.xml）
spring.main.banner-mode=off
logging.pattern.console=%msg%n

# DevTools 热重载配置
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# CORS配置
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# 高德地图API Key（从环境变量读取）
amap.key=${AMAP_KEY:06b7bda4226b76586cca0510e00015fb}

# MySQL数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/logistics?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 日志配置
logging.file.name=logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# 数据迁移配置（首次启动时自动从JSON文件迁移数据到数据库）
app.migration.enabled=true

# 车辆在线随机模拟（false=仅运单页手动改在线状态并持久化到数据库）
app.vehicle.telemetry.enabled=false
app.vehicle.telemetry.delay-ms=45000

# 模拟短信（控制台仅输出验证码与短信，见 logback-spring.xml）
app.sms.simulation.enabled=true
